name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Test validator
        run: uv run --with skills-ref==0.1.1 python -m unittest discover -s tests
      - name: Validate every skill
        run: uv run --with skills-ref==0.1.1 scripts/validate_skills.py
